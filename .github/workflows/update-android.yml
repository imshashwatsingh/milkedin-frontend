name: Android OTA Update

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  update:
    name: Publish Android OTA Update
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish OTA update (Android)
        run: eas update --branch production --platform android --message "OTA update ${{ github.sha }}" --non-interactive
